<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="freshGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="highlight" cx="30%" cy="30%" r="60%" fx="20%" fy="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main Gradient -->
  <rect width="1200" height="800" fill="url(#freshGrad)"/>

  <!-- Subtle Highlight -->
  <rect width="1200" height="800" fill="url(#highlight)"/>

  <!-- Clean geometric accents -->
  <circle cx="1000" cy="200" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="200" cy="600" r="150" fill="#ffffff" opacity="0.04"/>

  <!-- Professional diagonal lines -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="300" y2="100" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="0" y1="200" x2="350" y2="200" stroke="#ffffff" stroke-width="1"/>

    <line x1="900" y1="600" x2="1200" y2="600" stroke="#ffffff" stroke-width="2"/>
    <line x1="850" y1="650" x2="1200" y2="650" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="950" y1="700" x2="1200" y2="700" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>