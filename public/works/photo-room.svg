<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5f1eb"/><stop offset="1" stop-color="#e8e4de"/></linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7355"/><stop offset="1" stop-color="#6b5344"/></linearGradient>
    <linearGradient id="bedGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8f6f0"/><stop offset="1" stop-color="#e5e3dd"/></linearGradient>
    <linearGradient id="pillowGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0eeea"/></linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="1200" height="520" fill="url(#wallGrad)"/>

  <!-- Floor -->
  <rect y="520" width="1200" height="280" fill="url(#floorGrad)"/>

  <!-- Window with light -->
  <rect x="80" y="100" width="280" height="320" rx="8" fill="#d4e8f7"/>
  <rect x="90" y="110" width="260" height="300" rx="4" fill="#a8d4f0"/>
  <!-- Window frame -->
  <rect x="80" y="255" width="280" height="8" fill="#4a5568"/>
  <rect x="215" y="100" width="8" height="320" fill="#4a5568"/>
  <!-- Curtains -->
  <rect x="60" y="80" width="50" height="360" rx="4" fill="#e2d5c4"/>
  <rect x="330" y="80" width="50" height="360" rx="4" fill="#e2d5c4"/>

  <!-- Bed frame -->
  <rect x="480" y="380" width="580" height="180" rx="12" fill="#3d3d3d"/>

  <!-- Mattress -->
  <rect x="490" y="390" width="560" height="160" rx="8" fill="url(#bedGrad)"/>

  <!-- Bed sheet fold -->
  <path d="M490 420 Q600 400 750 420 Q900 400 1050 420" fill="none" stroke="#d4d2cc" stroke-width="3"/>

  <!-- Pillows -->
  <ellipse cx="600" cy="420" rx="80" ry="35" fill="url(#pillowGrad)"/>
  <ellipse cx="780" cy="420" rx="80" ry="35" fill="url(#pillowGrad)"/>

  <!-- Pillow details -->
  <ellipse cx="600" cy="415" rx="60" ry="20" fill="#f5f3ef" opacity="0.5"/>
  <ellipse cx="780" cy="415" rx="60" ry="20" fill="#f5f3ef" opacity="0.5"/>

  <!-- Nightstand left -->
  <rect x="420" y="480" width="70" height="100" rx="6" fill="#5c4033"/>
  <rect x="435" y="500" width="40" height="8" rx="2" fill="#3d2a22"/>

  <!-- Nightstand right -->
  <rect x="1050" y="480" width="70" height="100" rx="6" fill="#5c4033"/>
  <rect x="1065" y="500" width="40" height="8" rx="2" fill="#3d2a22"/>

  <!-- Lamp -->
  <ellipse cx="455" cy="475" rx="18" ry="5" fill="#ffd700"/>
  <rect x="450" y="440" width="10" height="35" fill="#8b7355"/>

  <!-- TV / Headboard area -->
  <rect x="700" y="320" width="140" height="80" rx="4" fill="#1a1a2e"/>
  <rect x="705" y="325" width="130" height="70" rx="2" fill="#0f0f1a"/>

  <!-- Carpet -->
  <rect x="520" y="540" width="500" height="200" rx="20" fill="#c9a882" opacity="0.4"/>

  <!-- Door -->
  <rect x="1080" y="200" width="100" height="280" rx="4" fill="#8b7355"/>
  <circle cx="1155" cy="340" r="8" fill="#ffd700"/>

  <!-- Quality badge -->
  <circle cx="1050" cy="150" r="35" fill="#22c55e"/>
  <text x="1050" y="155" fill="white" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">✓</text>
</svg>