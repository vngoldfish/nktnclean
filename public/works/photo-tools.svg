<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Tool case -->
  <rect x="150" y="200" width="400" height="450" rx="20" fill="url(#caseGrad)"/>
  <rect x="160" y="210" width="380" height="430" rx="15" fill="#1e40af"/>
  <!-- Case handle -->
  <rect x="280" y="170" width="140" height="35" rx="8" fill="#0f172a"/>
  <rect x="290" y="175" width="120" height="25" rx="5" fill="#475569"/>

  <!-- Mop -->
  <g>
    <rect x="620" y="150" width="25" height="450" rx="4" fill="#854d0e"/>
    <rect x="600" y="580" width="65" height="80" rx="8" fill="#a3a3a3"/>
    <!-- Mop strings -->
    <line x1="610" y1="650" x2="610" y2="720" stroke="#737373" stroke-width="3"/>
    <line x1="620" y1="650" x2="620" y2="730" stroke="#737373" stroke-width="3"/>
    <line x1="630" y1="650" x2="630" y2="725" stroke="#737373" stroke-width="3"/>
    <line x1="640" y1="650" x2="640" y2="720" stroke="#737373" stroke-width="3"/>
    <line x1="650" y1="650" x2="650" y2="728" stroke="#737373" stroke-width="3"/>
  </g>

  <!-- Vacuum cleaner -->
  <g>
    <rect x="750" y="400" width="200" height="120" rx="15" fill="#334155"/>
    <rect x="760" y="410" width="180" height="100" rx="10" fill="#475569"/>
    <!-- Handle -->
    <rect x="840" y="300" width="20" height="110" rx="4" fill="#1e293b"/>
    <!-- Wheels -->
    <circle cx="800" cy="530" r="25" fill="#1e293b"/>
    <circle cx="900" cy="530" r="25" fill="#1e293b"/>
    <circle cx="800" cy="530" r="15" fill="#475569"/>
    <circle cx="900" cy="530" r="15" fill="#475569"/>
  </g>

  <!-- Spray bottles in case -->
  <rect x="180" y="250" width="50" height="120" rx="8" fill="#22c55e"/>
  <rect x="185" y="260" width="40" height="15" rx="3" fill="#15803d"/>
  <rect x="240" y="250" width="50" height="120" rx="8" fill="#3b82f6"/>
  <rect x="245" y="260" width="40" height="15" rx="3" fill="#1d4ed8"/>
  <rect x="300" y="250" width="50" height="120" rx="8" fill="#fbbf24"/>
  <rect x="305" y="260" width="40" height="15" rx="3" fill="#d97706"/>
  <rect x="360" y="250" width="50" height="120" rx="8" fill="#ef4444"/>
  <rect x="365" y="260" width="40" height="15" rx="3" fill="#b91c1c"/>

  <!-- Microfiber cloths -->
  <rect x="180" y="400" width="80" height="80" rx="8" fill="#ef4444"/>
  <rect x="270" y="400" width="80" height="80" rx="8" fill="#3b82f6"/>
  <rect x="360" y="400" width="80" height="80" rx="8" fill="#22c55e"/>

  <!-- Bucket -->
  <g>
    <rect x="750" y="620" width="180" height="100" rx="10" fill="#64748b"/>
    <rect x="760" y="630" width="160" height="80" rx="8" fill="#94a3b8"/>
    <!-- Handle -->
    <path d="M770 620 Q840 580 910 620" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Labels -->
  <text x="350" y="700" fill="#1e3a8a" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">PROFESSIONAL TOOLS</text>
  <text x="840" y="700" fill="#1e3a8a" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">QUALITY EQUIPMENT</text>
</svg>