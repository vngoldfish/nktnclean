<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8f4f8"/><stop offset="1" stop-color="#d1e8f0"/></linearGradient>
    <linearGradient id="uniformGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e40af"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="floorTile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f0f0"/><stop offset="1" stop-color="#e0e0e0"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Floor tiles -->
  <rect y="550" width="1200" height="250" fill="url(#floorTile)"/>
  <!-- Tile lines -->
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#ccc" stroke-width="2"/>
  <line x1="0" y1="650" x2="1200" y2="650" stroke="#ccc" stroke-width="2"/>
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#ccc" stroke-width="2"/>
  <line x1="0" y1="750" x2="1200" y2="750" stroke="#ccc" stroke-width="2"/>
  <line x1="200" y1="550" x2="200" y2="800" stroke="#ccc" stroke-width="2"/>
  <line x1="400" y1="550" x2="400" y2="800" stroke="#ccc" stroke-width="2"/>
  <line x1="600" y1="550" x2="600" y2="800" stroke="#ccc" stroke-width="2"/>
  <line x1="800" y1="550" x2="800" y2="800" stroke="#ccc" stroke-width="2"/>
  <line x1="1000" y1="550" x2="1000" y2="800" stroke="#ccc" stroke-width="2"/>

  <!-- Staff member 1 - Left -->
  <g>
    <!-- Body -->
    <rect x="200" y="280" width="120" height="200" rx="10" fill="url(#uniformGrad)"/>
    <!-- Head -->
    <circle cx="260" cy="240" r="45" fill="#f5d0b5"/>
    <!-- Hair -->
    <path d="M220 210 Q260 185 300 210" fill="#2d3748"/>
    <!-- Arms -->
    <rect x="180" y="300" width="30" height="120" rx="8" fill="#1e3a8a"/>
    <rect x="310" y="300" width="30" height="120" rx="8" fill="#1e3a8a"/>
    <!-- Name tag -->
    <rect x="225" y="350" width="70" height="25" rx="3" fill="#fbbf24"/>
    <text x="260" y="368" fill="#1e3a8a" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">STAFF</text>
    <!-- Gloves -->
    <ellipse cx="195" cy="420" rx="18" ry="12" fill="#ffffff"/>
    <ellipse cx="325" cy="420" rx="18" ry="12" fill="#ffffff"/>
  </g>

  <!-- Staff member 2 - Right -->
  <g>
    <!-- Body -->
    <rect x="880" y="280" width="120" height="200" rx="10" fill="url(#uniformGrad)"/>
    <!-- Head -->
    <circle cx="940" cy="240" r="45" fill="#d4a574"/>
    <!-- Hair -->
    <path d="M900 210 Q940 185 980 210" fill="#1a202c"/>
    <!-- Arms -->
    <rect x="860" y="300" width="30" height="120" rx="8" fill="#1e3a8a"/>
    <rect x="990" y="300" width="30" height="120" rx="8" fill="#1e3a8a"/>
    <!-- Name tag -->
    <rect x="905" y="350" width="70" height="25" rx="3" fill="#fbbf24"/>
    <text x="940" y="368" fill="#1e3a8a" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">STAFF</text>
    <!-- Gloves -->
    <ellipse cx="875" cy="420" rx="18" ry="12" fill="#ffffff"/>
    <ellipse cx="1005" cy="420" rx="18" ry="12" fill="#ffffff"/>
  </g>

  <!-- Cleaning cart between them -->
  <g>
    <!-- Cart body -->
    <rect x="520" y="380" width="160" height="140" rx="8" fill="#4a5568"/>
    <!-- Cart top shelf -->
    <rect x="510" y="360" width="180" height="25" rx="4" fill="#2d3748"/>
    <!-- Wheels -->
    <circle cx="555" cy="530" r="18" fill="#1a202c"/>
    <circle cx="645" cy="530" r="18" fill="#1a202c"/>
    <circle cx="555" cy="530" r="10" fill="#4a5568"/>
    <circle cx="645" cy="530" r="10" fill="#4a5568"/>
    <!-- Supplies on cart -->
    <rect x="535" y="340" width="30" height="25" rx="3" fill="#22c55e"/>
    <rect x="575" y="335" width="25" height="30" rx="3" fill="#3b82f6"/>
    <rect x="610" y="342" width="35" height="23" rx="3" fill="#fbbf24"/>
    <!-- Spray bottle -->
    <rect x="655" y="330" width="20" height="35" rx="4" fill="#ef4444"/>
    <rect x="660" y="320" width="10" height="12" rx="2" fill="#991b1b"/>
  </g>

  <!-- Communication lines -->
  <path d="M320 320 Q400 280 520 300" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="5,3"/>
  <path d="M880 320 Q800 280 680 300" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- Check marks -->
  <circle cx="340" cy="290" r="15" fill="#22c55e"/>
  <text x="340" y="295" fill="white" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">✓</text>
  <circle cx="860" cy="290" r="15" fill="#22c55e"/>
  <text x="860" y="295" fill="white" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">✓</text>
</svg>