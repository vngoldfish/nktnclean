  <rect x="130" y="460" width="540" height="20" rx="10" fill="#334155"/>
  <rect x="130" y="460" width="432" height="20" rx="10" fill="#3b82f6"/>

  <rect x="130" y="500" width="540" height="20" rx="10" fill="#334155"/>
