  <rect x="410" y="300" width="120" height="90" rx="8" fill="#334155"/>
  <rect x="415" y="305" width="110" height="80" rx="6" fill="#475569"/>
  <circle cx="470" cy="345" r="20" fill="#22c55e"/>
  <text x="470" y="352" fill="white" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">✓</text>

  <rect x="550" y="300" width="120" height="90" rx="8" fill="#334155"/>
  <rect x="555" y="305" width="110" height="80" rx="6" fill="#475569"/>
