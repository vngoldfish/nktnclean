<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trustGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#22c55e" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1200" height="600" fill="url(#trustGrad)"/>

  <!-- Subtle dot pattern -->
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- Clean accent shapes -->
  <ellipse cx="150" cy="100" rx="80" ry="40" fill="#bbf7d0" opacity="0.3"/>
  <ellipse cx="1050" cy="500" rx="100" ry="50" fill="#86efac" opacity="0.2"/>

  <!-- Professional border accents -->
  <rect x="40" y="40" width="1120" height="520" rx="20" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.15"/>
</svg>